<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UI LAW CBT</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Setup screen: choose subject + mode -->
  <div id="setupScreen" class="app">
    <h1>Take a Test</h1>
    <p class="subtitle">Choose a subject and how you want to practice.</p>

    <div class="form-group">
      <label for="subjectSelect">Subject</label>
      <select id="subjectSelect">
        <option value="LAW 101">LAW 101 - English for Legal Writing</option>
        <option value="PUL 101">PUL 101 - Introduction to Law</option>
        <option value="CLL 103">CLL 103 - Latin for Lawyers</option>
        <option value="GES 101">GES 101</option>
        <option value="GST 111">GST 111 - Communication</option>
        <option value="GST 112">GST 112 - Nigerian Peoples & Culture</option>
        <option value="PHIL 101">PHIL 101</option>
        <option value="PHIL 102">PHIL 102</option>
        <option value="POS 113">POS 113</option>
        <option value="PSY 101">PSY 101</option>
        <option value="ANT 115">ANT 115</option>
        <option value="SOC 102">SOC 102</option>
        <option value="ENG 116">ENG 116 - Poetry</option>
      </select>
    </div>

    <div class="mode-toggle">
      <button id="practiceModeBtn" class="mode-btn active">Practice Mode</button>
      <button id="examModeBtn" class="mode-btn">Exam Mode</button>
    </div>
    <p class="mode-description" id="modeDescription">See if you're right immediately after each question.</p>

    <button id="startBtn" class="btn-primary">Start Test</button>
    <div id="setupStatus" class="status-message hidden"></div>
  </div>

  <!-- Test-taking screen -->
  <div id="testScreen" class="app hidden">
    <div class="test-header">
      <span id="progressLabel">Question 1 of 10</span>
      <span id="subjectLabel"></span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <h2 id="questionText" class="question-text"></h2>

    <div id="optionsContainer" class="options-container"></div>

    <!-- Instant feedback, shown only in practice mode -->
    <div id="instantFeedback" class="instant-feedback hidden"></div>

    <button id="nextBtn" class="btn-primary hidden">Next Question</button>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="take-test.js"></script>
</body>
</html>
